<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>VLM SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#050505;
  --card:#151515;
  --blue:#1677FF;
  --line:#202b3b;
  --text:#fff;
  --muted:#a0a7b4;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:950px;margin:auto;padding:18px 15px 100px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{flex:1;font-size:25px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--blue)}
.icon{
  width:44px;height:44px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);color:white;font-size:21px
}
.search{
  width:100%;padding:15px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);color:white;outline:none
}
.search:focus,.field:focus{border-color:var(--blue)}
.section-title{margin:25px 0 5px;font-size:22px;font-weight:800}
.subtitle{color:var(--muted);font-size:13px}
.chips,.sorts{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.chip,.sort{
  flex-shrink:0;padding:10px 15px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:white
}
.chip.active,.sort.active{background:var(--blue);border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{
  min-width:0;overflow:hidden;background:var(--card);
  border:1px solid var(--line);border-radius:17px;cursor:pointer;
  transition:border-color .2s,transform .2s
}
.product:active{transform:scale(.98)}
.product:hover{border-color:var(--blue)}
.pic{
  width:100%;aspect-ratio:1/1;display:flex;align-items:center;
  justify-content:center;background:#0b0d12;color:#737e90;overflow:hidden
}
.pic img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:42px;color:var(--blue)}
.pbody{padding:12px}
.name{font-size:15px;font-weight:750;overflow-wrap:anywhere}
.stock{margin-top:7px;font-size:12px;color:#36a3ff}
.stock.out{color:#888}
.price{margin-top:9px;font-size:18px;font-weight:850}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.btn{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:var(--blue);color:white;font-weight:750
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cartbar{
  position:fixed;display:none;align-items:center;justify-content:space-between;
  left:12px;right:12px;bottom:12px;max-width:920px;margin:auto;
  padding:16px;background:var(--blue);color:white;border-radius:15px;
  font-weight:800;z-index:10;box-shadow:0 5px 30px #0009;cursor:pointer
}
.cartbar.show{display:flex}
.overlay,.modal{position:fixed;inset:0;z-index:20;display:none;background:#000b}
.overlay.show,.modal.show{display:block}
.sheet{
  position:absolute;top:0;right:0;width:min(88%,400px);height:100%;
  overflow-y:auto;padding:24px;background:#101116;border-left:1px solid var(--line)
}
.close{float:right;border:0;background:none;color:white;font-size:29px}
.menuitem{
  width:100%;padding:17px 0;text-align:left;border:0;
  border-bottom:1px solid var(--line);background:none;color:white
}
.modal{z-index:30;overflow-y:auto;padding:20px 12px}
.modal.show{display:flex;align-items:flex-end;justify-content:center}
.modalbox{
  position:relative;width:100%;max-width:550px;max-height:90vh;
  overflow-y:auto;padding:22px;border:1px solid var(--line);
  border-radius:22px 22px 16px 16px;background:#101116
}
.hero{
  width:100%;max-height:330px;object-fit:contain;border-radius:14px;
  background:#08090c
}
.muted{color:var(--muted);line-height:1.6}
.qty{display:flex;align-items:center;gap:8px}
.qty button,.qtybtn{
  width:34px;height:34px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:white
}
.field{
  width:100%;padding:14px;margin:7px 0;border:1px solid var(--line);
  border-radius:11px;background:var(--card);color:white;outline:none
}
.field[readonly]{opacity:.85;cursor:not-allowed}
.variant{display:flex;align-items:center;gap:10px;margin:12px 0}
.tiers{
  padding:12px;margin:12px 0;background:#151a23;
  border:1px solid var(--line);border-radius:12px;
  font-size:13px;line-height:1.8;color:#cbd5e1
}
.footer{
  margin-top:35px;padding-top:20px;border-top:1px solid var(--line);
  text-align:center;color:var(--muted);font-size:12px
}
@media(min-width:650px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .app{padding-top:28px}
}
@media(min-width:850px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">VLM <span>SHOP</span></div>
    <button class="icon" onclick="openCart()" aria-label="Корзина">🛒</button>
    <button class="icon" onclick="openMenu()" aria-label="Меню">☰</button>
  </header>
  <input id="search" class="search" placeholder="⌕ Поиск товаров..." oninput="render()">
  <div class="section-title">КАТАЛОГ</div>
  <div class="subtitle">Выбери то, что тебе нужно</div>
  <div id="cats" class="chips"></div>
  <div class="sorts">
    <button id="sortStock" class="sort active" onclick="setSort('stock')">По наличию ↓</button>
    <button id="sortName" class="sort" onclick="setSort('name')">По названию</button>
  </div>
  <div id="grid" class="grid"></div>
  <footer class="footer">VLM SHOP · BLACK & ELECTRIC BLUE</footer>
</div>
<div id="cartbar" class="cartbar" onclick="openCart()">
  <span>🛒 Открыть корзину</span>
  <span id="cartCount">0</span>
</div>
<div id="menuOverlay" class="overlay" onclick="if(event.target===this)closeMenu()">
  <div class="sheet">
    <button class="close" onclick="closeMenu()">×</button>
    <h2>VLM SHOP</h2>
    <p class="muted">Меню магазина</p>
    <button class="menuitem" onclick="info('О магазине','Добро пожаловать в VLM SHOP!')">О магазине</button>
    <button class="menuitem" onclick="info('Доставка','Место встречи: возле McDonald’s. Уточните детали у менеджера.')">Доставка</button>
    <button class="menuitem" onclick="info('Оплата','Уточните доступные способы оплаты у менеджера.')">Оплата</button>
    <button class="menuitem" onclick="contact()">👨‍💼 Связаться с менеджером</button>
    <button class="menuitem" onclick="telegram()">✈️ Перейти в Telegram-магазин</button>
    <p class="muted">Black & Electric Blue</p>
  </div>
</div>
<div id="productModal" class="modal" onclick="if(event.target===this)closeProduct()">
  <div class="modalbox" id="productBox"></div>
</div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()">
  <div class="modalbox">
    <button class="close" onclick="closeCart()">×</button>
    <h2>Корзина</h2>
    <div id="cartItems"></div>
    <div id="cartTotal" style="margin:16px 0;font-weight:800"></div>
    <button id="checkoutBtn" class="btn" onclick="checkout()">Оформить заказ</button>
  </div>
</div>

let category = "Все";
let sort = "stock";
let cart = [];
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}
function money(n){
  return `${n} ${CURRENCY}`;
}
/* Считает скидку по количеству конкретного товара */
function unitPrice(p,qty){
  if(!p.tiers)return p.price;
  let price=p.price;
  for(const [minQty,tierPrice] of p.tiers){
    if(qty>=minQty)price=tierPrice;
  }
  return price;
}
function lineTotal(p,qty){
  return unitPrice(p,qty)*qty;
}
function tierDescription(p){
  if(!p.tiers)return "";
  return `
    <div class="tiers">
      <b>Цена за штуку:</b><br>
      ${p.tiers.map(([qty,price])=>
        `От ${qty} шт. — ${price} ${CURRENCY}/шт.`
      ).join("<br>")}
    </div>
  `;
}
function categories(){
  const cs=[
    "Все",
    "Устройство",
    "Картриджи",
    "Жидкость",
    "Одноразки"
  ];
  document.getElementById("cats").innerHTML=cs.map(c=>`
    <button class="chip ${c===category?'active':''}"
      onclick="chooseCategory('${esc(c)}')">${esc(c)}</button>
  `).join("");
}
function chooseCategory(c){
  category=c;
  render();
}
function render(){
  categories();
  const q=document.getElementById("search").value.trim().toLowerCase();
  let arr=products.filter(p=>
    (category==="Все"||p.cat===category)&&
    p.name.toLowerCase().includes(q)
  );
  if(sort==="stock"){
    arr.sort((a,b)=>b.stock-a.stock);
  }else{
    arr.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  }
  document.getElementById("grid").innerHTML=arr.length
    ?arr.map(p=>`
      <article class="product" onclick="openProduct(${p.id})">
        <div class="pic">
          ${p.img
            ?`<img src="${esc(p.img)}" alt="${esc(p.name)}"
                 onerror="this.style.display='none'">`
            :`<span class="placeholder">✦</span>`
          }
        </div>
        <div class="pbody">
          <div class="name">${esc(p.name)}</div>
          <div class="stock ${p.stock<=0?'out':''}">
            ${p.stock>0?'● В наличии':'Нет в наличии'}
          </div>
          <div class="price">${money(p.price)}</div>
          ${p.tiers?`
            <div class="muted" style="font-size:11px;margin-top:6px">
              От ${p.tiers[1][0]} шт. — ${p.tiers[1][1]} zł/шт.
              <br>От ${p.tiers[2][0]} шт. — ${p.tiers[2][1]} zł/шт.
            </div>
          `:""}
        </div>
      </article>
    `).join("")
    :`<div class="empty">Ничего не найдено</div>`;
  updateCartBar();
}
function setSort(s){
  sort=s;
  document.getElementById("sortStock").classList.toggle("active",s==="stock");
  document.getElementById("sortName").classList.toggle("active",s==="name");
  render();
}
function openMenu(){
  document.getElementById("menuOverlay").classList.add("show");
}
function closeMenu(){
  document.getElementById("menuOverlay").classList.remove("show");
}
function info(title,text){
  closeMenu();
  alert(title+"\n\n"+text);
}
function openTelegram(url){
  closeMenu();
  if(tg&&tg.initData){
    tg.openTelegramLink(url);
  }else{
    window.open(url,"_blank","noopener");
  }
}
function contact(){
  openTelegram(CONTACT_URL);
}
function telegram(){
  openTelegram(SHOP_URL);
}
function openProduct(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;
  const qty=cart.find(x=>x.pid===id)?.qty||0;
  document.getElementById("productBox").innerHTML=`
    <button class="close" onclick="closeProduct()">×</button>
    <h2>${esc(p.name)}</h2>
    ${p.img
      ?`<img class="hero" src="${esc(p.img)}" alt="${esc(p.name)}">`
      :`<div class="pic" style="border-radius:14px">
          <span class="placeholder">✦</span>
        </div>`
    }
    <h2>${money(p.price)}</h2>
    <p class="muted">${esc(p.desc)}</p>
    ${tierDescription(p)}
    <p class="muted">
      Категория: ${esc(p.cat)}<br>
      В наличии: ${p.stock}
    </p>
    <div class="variant">
      <div style="flex:1">Количество</div>
      <div class="qty">
        <button onclick="change(${p.id},-1)">−</button>
        <span id="q-${p.id}">${qty}</span>
        <button onclick="change(${p.id},1)"
          ${p.stock<=0||qty>=p.stock?'disabled':''}>+</button>
      </div>
    </div>
    <button class="btn" style="margin-top:18px"
      onclick="closeProduct();openCart()">
      Перейти в корзину
    </button>
  `;
  document.getElementById("productModal").classList.add("show");
}
function closeProduct(){
  document.getElementById("productModal").classList.remove("show");
}
function change(pid,d){
  const p=products.find(x=>x.id===pid);
  if(!p)return;
  let item=cart.find(x=>x.pid===pid);
  if(d>0&&p.stock<=0){
    alert("Товара нет в наличии.");
    return;
  }
  if(!item&&d>0){
    item={pid,qty:0};
    cart.push(item);
  }
  if(item){
    if(d>0&&item.qty>=p.stock){
      alert("Больше товара нет в наличии.");
      return;
    }
    item.qty=Math.max(0,item.qty+d);
    if(item.qty===0){
      cart=cart.filter(x=>x!==item);
    }
  }
  const q=document.getElementById("q-"+pid);
  if(q)q.textContent=cart.find(x=>x.pid===pid)?.qty||0;
  updateCartBar();
  // Обновляет доступность кнопки "+"
  if(document.getElementById("productModal").classList.contains("show")){
    openProduct(pid);
  }
}
function updateCartBar(){
  const n=cart.reduce((s,x)=>s+x.qty,0);
  document.getElementById("cartCount").textContent=n;
  document.getElementById("cartbar").classList.toggle("show",n>0);
}
function openCart(){
  const box=document.getElementById("cartItems");
  const checkoutBtn=document.getElementById("checkoutBtn");
  if(!cart.length){
    box.innerHTML='<p class="muted">Корзина пока пуста.</p>';
    document.getElementById("cartTotal").textContent="";
  }else{
    let total=0;
    box.innerHTML=cart.map(x=>{
      const p=products.find(a=>a.id===x.pid);
      if(!p)return "";
      const price=unitPrice(p,x.qty);
      const sum=lineTotal(p,x.qty);
      total+=sum;
      return `
        <div class="variant">
          <div style="flex:1;min-width:0">
            <div>${esc(p.name)}</div>
            <div class="muted" style="font-size:12px">
              ${x.qty} × ${money(price)}
            </div>
            <div style="font-weight:800;margin-top:4px">
              ${money(sum)}
            </div>
          </div>
          <div class="qty">
            <button onclick="change(${p.id},-1);openCart()">−</button>
            <span>${x.qty}</span>
            <button onclick="change(${p.id},1);openCart()"
              ${x.qty>=p.stock?'disabled':''}>+</button>
          </div>
        </div>
      `;
    }).join("");
    document.getElementById("cartTotal").textContent="Итого: "+money(total);
  }
  checkoutBtn.style.display="block";
  document.getElementById("cartModal").classList.add("show");
}
function closeCart(){
  document.getElementById("cartModal").classList.remove("show");
}
function checkout(){
  if(!cart.length){
    alert("Корзина пуста.");
    return;
  }
  document.getElementById("cartItems").innerHTML=`
    <h3>Контактные данные</h3>
    <p class="muted">
      Проверь контактные данные перед отправкой заказа.
    </p>
    <input id="customerName" class="field"
      placeholder="Ваше имя" autocomplete="name" maxlength="100">
    <input id="customerContact" class="field"
      placeholder="Телефон или @username" autocomplete="tel" maxlength="100">
    <label for="customerComment" class="muted">Место встречи</label>
    <input id="customerComment" class="field"
      value="${MEETING_ADDRESS}" readonly aria-readonly="true">
    <button class="btn" onclick="sendOrder()">
      Перейти к отправке заказа в Telegram
    </button>
    <button class="btn" style="margin-top:10px;background:#252a35"
      onclick="openCart()">
      Назад в корзину
    </button>
  `;
  document.getElementById("cartTotal").textContent="";
  document.getElementById("checkoutBtn").style.display="none";
}
function sendOrder(){
  const name=document.getElementById("customerName").value.trim();
  const contactValue=document.getElementById("customerContact").value.trim();
  if(!name||!contactValue){
    alert("Заполни имя и контакт.");
    return;
  }
  if(!cart.length){
    alert("Корзина пуста.");
    return;
  }
  let total=0;
  const itemsText=cart.map(x=>{
    const p=products.find(a=>a.id===x.pid);
    if(!p)return "";
    const price=unitPrice(p,x.qty);
    const sum=lineTotal(p,x.qty);
    total+=sum;
    return `• ${p.name} — ${x.qty} шт. × ${money(price)} = ${money(sum)}`;
  }).filter(Boolean).join("\n");
  const orderText=
`🛍️ НОВЫЙ ЗАКАЗ — VLM SHOP
👤 Имя: ${name}
📞 Контакт: ${contactValue}
📦 Товары:
${itemsText}
💰 Итого: ${money(total)}
📍 Место встречи: ${MEETING_ADDRESS}
Пожалуйста, подтвердите заказ.`;
  const url=CONTACT_URL+"?text="+encodeURIComponent(orderText);
  // Корзина сохраняется до нажатия кнопки отправки.
  closeCart();
  closeProduct();
  if(tg&&tg.initData){
    tg.openTelegramLink(url);
  }else{
    window.open(url,"_blank","noopener");
  }
  alert(
    "Telegram откроется для отправки заказа. " +
    "Проверь сообщение и нажми «Отправить» в чате менеджера. " +
    "Заказ не отправляется автоматически."
  );
}
render();
</script>
</body>
</html>
