
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>VLM SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#050505;
  --card:#151515;
  --blue:#1677FF;
  --line:#202b3b;
  --text:#fff;
  --muted:#a0a7b4;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:950px;margin:auto;padding:18px 15px 100px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{flex:1;font-size:25px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--blue)}
.icon{
  width:44px;height:44px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);color:white;font-size:21px
}
.lang{
  height:44px;padding:0 8px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:white
}
.search{
  width:100%;padding:15px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);color:white;outline:none
}
.search:focus,.field:focus{border-color:var(--blue)}
.section-title{margin:25px 0 5px;font-size:22px;font-weight:800}
.subtitle{color:var(--muted);font-size:13px}
.chips,.sorts{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.chip,.sort{
  flex-shrink:0;padding:10px 15px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:white
}
.chip.active,.sort.active{background:var(--blue);border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{
  min-width:0;overflow:hidden;background:var(--card);
  border:1px solid var(--line);border-radius:17px;cursor:pointer;
  transition:border-color .2s,transform .2s
}
.product:active{transform:scale(.98)}
.product:hover{border-color:var(--blue)}
.pic{
  width:100%;aspect-ratio:1/1;display:flex;align-items:center;
  justify-content:center;background:#0b0d12;color:#737e90;overflow:hidden
}
.pic img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:42px;color:var(--blue)}
.pbody{padding:12px}
.name{font-size:15px;font-weight:750;overflow-wrap:anywhere}
.stock{margin-top:7px;font-size:12px;color:#36a3ff}
.stock.out{color:#888}
.price{margin-top:9px;font-size:18px;font-weight:850}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.btn{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:var(--blue);color:white;font-weight:750
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cartbar{
  position:fixed;display:none;align-items:center;justify-content:space-between;
  left:12px;right:12px;bottom:12px;max-width:920px;margin:auto;
  padding:16px;background:var(--blue);color:white;border-radius:15px;
  font-weight:800;z-index:10;box-shadow:0 5px 30px #0009;cursor:pointer
}
.cartbar.show{display:flex}
.overlay,.modal{position:fixed;inset:0;z-index:20;display:none;background:#000b}
.overlay.show,.modal.show{display:block}
.sheet{
  position:absolute;top:0;right:0;width:min(88%,400px);height:100%;
  overflow-y:auto;padding:24px;background:#101116;border-left:1px solid var(--line)
}
.close{float:right;border:0;background:none;color:white;font-size:29px}
.menuitem{
  width:100%;padding:17px 0;text-align:left;border:0;
  border-bottom:1px solid var(--line);background:none;color:white
}
.modal{z-index:30;overflow-y:auto;padding:20px 12px}
.modal.show{display:flex;align-items:flex-end;justify-content:center}
.modalbox{
  position:relative;width:100%;max-width:550px;max-height:90vh;
  overflow-y:auto;padding:22px;border:1px solid var(--line);
  border-radius:22px 22px 16px 16px;background:#101116
}
.hero{
  width:100%;max-height:330px;object-fit:contain;border-radius:14px;
  background:#08090c
}
.muted{color:var(--muted);line-height:1.6}
.qty{display:flex;align-items:center;gap:8px}
.qty button{
  width:34px;height:34px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:white
}
.field,.flavor-select{
  width:100%;padding:14px;margin:7px 0;border:1px solid var(--line);
  border-radius:11px;background:var(--card);color:white;outline:none
}
.field[readonly]{opacity:.85;cursor:not-allowed}
.tiers{
  padding:12px;margin:12px 0;background:#151a23;
  border:1px solid var(--line);border-radius:12px;
  font-size:13px;line-height:1.8;color:#cbd5e1
}
.footer{
  margin-top:35px;padding-top:20px;border-top:1px solid var(--line);
  text-align:center;color:var(--muted);font-size:12px
}
@media(min-width:650px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .app{padding-top:28px}
}
@media(min-width:850px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">VLM <span>SHOP</span></div>
    <select id="language" class="lang" aria-label="Language" onchange="setLanguage(this.value)">
      <option value="ru">RU</option>
      <option value="pl">PL</option>
      <option value="en">EN</option>
    </select>
    <button class="icon" onclick="openCart()" aria-label="Cart">🛒</button>
    <button class="icon" onclick="openMenu()" aria-label="Menu">☰</button>
  </header>

  <input id="search" class="search" placeholder="⌕ Поиск товаров..." oninput="render()">
  <div class="section-title" id="catalogTitle">КАТАЛОГ</div>
  <div class="subtitle" id="catalogSubtitle">Выбери то, что тебе нужно</div>
  <div id="cats" class="chips"></div>
  <div class="sorts">
    <button id="sortStock" class="sort active" onclick="setSort('stock')">По наличию ↓</button>
    <button id="sortName" class="sort" onclick="setSort('name')">По названию</button>
  </div>
  <div id="grid" class="grid"></div>
  <footer class="footer">VLM SHOP · BLACK & ELECTRIC BLUE</footer>
</div>

<div id="cartbar" class="cartbar" onclick="openCart()">
  <span id="cartbarLabel">🛒 Открыть корзину</span>
  <span id="cartCount">0</span>
</div>

<div id="menuOverlay" class="overlay" onclick="if(event.target===this)closeMenu()">
  <div class="sheet">
    <button class="close" onclick="closeMenu()">×</button>
    <h2>VLM SHOP</h2>
    <p class="muted" id="menuSubtitle">Меню магазина</p>
    <button class="menuitem" onclick="info('about')" id="menuAbout">О магазине</button>
    <button class="menuitem" onclick="info('delivery')" id="menuDelivery">Доставка</button>
    <button class="menuitem" onclick="info('payment')" id="menuPayment">Оплата</button>
    <button class="menuitem" onclick="contact()" id="menuContact">👨‍💼 Связаться с менеджером</button>
    <button class="menuitem" onclick="telegram()" id="menuTelegram">✈️ Перейти в Telegram-магазин</button>
    <p class="muted">Black & Electric Blue</p>
  </div>
</div>

<div id="productModal" class="modal" onclick="if(event.target===this)closeProduct()">
  <div class="modalbox" id="productBox"></div>
</div>

<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()">
  <div class="modalbox">
    <button class="close" onclick="closeCart()">×</button>
    <h2 id="cartTitle">Корзина</h2>
    <div id="cartItems"></div>
    <div id="cartTotal" style="margin:16px 0;font-weight:800"></div>
    <button id="checkoutBtn" class="btn" onclick="checkout()">Оформить заказ</button>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const CONTACT_URL="https://t.me/Manager_VLM";
const SHOP_URL="https://t.me/VLM_SHOP";
const MEETING_ADDRESS="Возле McDonald's";
const CURRENCY="zł";

},

 inStock:"● Dostępny",outStock:"Brak w magazynie",nothing:"Nie znaleziono produktów",

},

 stockSort:"Availability ↓",nameSort:"Sort by name",cart:"Cart",

};

const elfliqFlavors=[
"Cherry 🍒",
"Watermelon 🍉",
"Blueberry 🫐",
"Grape 🍇",
"Green Grape Rose 🍇 🌺",
"Double Apple 🍎 🍏",
"Apple Peach 🍎 🍑",
"Spearmint 🌿🧊",
"Cool Mint 🥶",
"Lemon Lime 🍋 🍋‍🟩",
"Strawberry Ice 🍓🧊",
"Pineapple Ice 🍍🧊",
"Blue Razz Ice 🫐🧊",
"Blue Razz Lemonade 🫐🥤",
"Strawberry Razz Lemonade 🍓🥤",
"Strawberry Banana 🍓🍌",
"Kiwi Passion Fruit Guava 🥝🍈",
"Cola 🥤"
];

const products=[
{id:1,name:"Xros 6",cat:"Устройство",price:160,stock:10,img:"",descKey:"deviceXros"},
{id:2,name:"Xros 6 Mini",cat:"Устройство",price:140,stock:10,img:"",descKey:"deviceMini"},
{id:3,name:"Elfliq",cat:"Жидкость",price:55,tiers:[[1,55],[3,50],[5,45]],stock:20,img:"IMG_0365.jpeg"},
{id:21,name:"Cartridge 0.8",cat:"Картриджи",price:30,tiers:[[1,30],[3,27],[5,25]],stock:20,img:"",desc:"Cartridge 0.8 Ω."},
{id:22,name:"Cartridge 0.6",cat:"Картриджи",price:30,tiers:[[1,30],[3,27],[5,25]],stock:20,img:"",desc:"Cartridge 0.6 Ω."},
{id:23,name:"Cartridge 0.4",cat:"Картриджи",price:30,tiers:[[1,30],[3,27],[5,25]],stock:20,img:"",desc:"Cartridge 0.4 Ω."}
];

let lang="ru";
let category="Все";
let sort="stock";
let cart=[];
let selectedFlavor={3:elfliqFlavors[0]};

function t(key){return I18N[lang]?.[key]??I18N.ru[key]??key}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function money(n){return `${n} ${CURRENCY}`}
function unitPrice(p,qty){
 if(!p.tiers)return p.price;
 let price=p.price;
 for(const [minQty,tierPrice] of p.tiers)if(qty>=minQty)price=tierPrice;
 return price;
}
function lineTotal(p,qty){return unitPrice(p,qty)*qty}
function flavorKey(pid,flavor){return pid===3?flavor:""}
function getCartItem(pid,flavor=""){
 return cart.find(x=>x.pid===pid&&x.flavor===flavorKey(pid,flavor));
}
function productLabel(p){
 return p.id===3?`Elfliq — ${selectedFlavor[3]||elfliqFlavors[0]}`:p.name;
}

function setLanguage(value){
 lang=I18N[value]?value:"ru";
 document.documentElement.lang=lang;
 document.getElementById("language").value=lang;
 const tr=I18N[lang];
 document.getElementById("search").placeholder=tr.search;
 document.getElementById("catalogTitle").textContent=tr.catalog;
 document.getElementById("catalogSubtitle").textContent=tr.subtitle;
 document.getElementById("sortStock").textContent=tr.stockSort;
 document.getElementById("sortName").textContent=tr.nameSort;
 document.getElementById("cartTitle").textContent=tr.cart;
 document.getElementById("cartbarLabel").textContent=tr.openCart;
 document.getElementById("menuSubtitle").textContent=tr.menu;
 document.getElementById("menuAbout").textContent=tr.about;
 document.getElementById("menuDelivery").textContent=tr.delivery;
 document.getElementById("menuPayment").textContent=tr.payment;
 document.getElementById("menuContact").textContent=tr.contact;
 document.getElementById("menuTelegram").textContent=tr.telegram;
 render();
}

function categories(){
 const canonical=["Все","Устройство","Картриджи","Жидкость","Одноразки"];
 document.getElementById("cats").innerHTML=canonical.map((c,i)=>`
  <button class="chip ${c===category?'active':''}" onclick="chooseCategory('${c}')">
  ${esc(t("categories")[i]||c)}</button>
 `).join("");
}
function chooseCategory(c){category=c;render()}

function render(){
 categories();
 const q=document.getElementById("search").value.trim().toLowerCase();
 let arr=products.filter(p=>
  (category==="Все"||p.cat===category)&&
  (productLabel(p).toLowerCase().includes(q)||p.name.toLowerCase().includes(q))
 );
 if(sort==="stock")arr.sort((a,b)=>b.stock-a.stock);
 else arr.sort((a,b)=>a.name.localeCompare(b.name,"ru"));

 document.getElementById("grid").innerHTML=arr.length?arr.map(p=>`
  <article class="product" onclick="openProduct(${p.id})">
   <div class="pic">
    ${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:`<span class="placeholder">✦</span>`}
   </div>
   <div class="pbody">
    <div class="name">${esc(p.name)}</div>
    ${p.id===3?`<div class="muted" style="font-size:12px;margin-top:5px">${esc(t("flavor"))}: ${elfliqFlavors.length}</div>`:""}
    <div class="stock ${p.stock<=0?'out':''}">${p.stock>0?t("inStock"):t("outStock")}</div>
    <div class="price">${money(p.price)}</div>
    ${p.tiers?`<div class="muted" style="font-size:11px;margin-top:6px">${t("from")} 3 ${t("pieces")} — 50 zł/шт.<br>${t("from")} 5 ${t("pieces")} — 45 zł/шт.</div>`:""}
   </div>
  </article>
 `).join(""):`<div class="empty">${t("nothing")}</div>`;
 updateCartBar();
}

function setSort(s){
 sort=s;
 document.getElementById("sortStock").classList.toggle("active",s==="stock");
 document.getElementById("sortName").classList.toggle("active",s==="name");
 render();
}
function openMenu(){document.getElementById("menuOverlay").classList.add("show")}
function closeMenu(){document.getElementById("menuOverlay").classList.remove("show")}
function info(which){
 closeMenu();
 const title=which==="about"?t("about"):which==="delivery"?t("delivery"):t("payment");
 const message=which==="about"?t("aboutText"):which==="delivery"?t("deliveryText"):t("paymentText");
 alert(title+"\n\n"+message);
}
function openTelegram(url){
 closeMenu();
 if(tg&&tg.initData)tg.openTelegramLink(url);
 else window.open(url,"_blank","noopener");
}
function contact(){openTelegram(CONTACT_URL)}
function telegram(){openTelegram(SHOP_URL)}

function tierDescription(p){
 if(!p.tiers)return "";
 if(p.id===3){
  return `<div class="tiers"><b>${t("perPiece")}</b><br>1–2 ${t("pieces")} — 55 zł<br>${t("from")} 3 ${t("pieces")} — 50 zł<br>${t("from")} 5 ${t("pieces")} — 45 zł</div>`;
 }
 return `<div class="tiers"><b>${t("perPiece")}</b><br>1–2 ${t("pieces")} — 30 zł<br>${t("from")} 3 ${t("pieces")} — 27 zł<br>${t("from")} 5 ${t("pieces")} — 25 zł</div>`;
}

function openProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 const flavor=p.id===3?(selectedFlavor[3]||elfliqFlavors[0]):"";
 const item=getCartItem(id,flavor);
 const qty=item?.qty||0;

 document.getElementById("productBox").innerHTML=`
  <button class="close" onclick="closeProduct()">×</button>
  <h2>${esc(p.id===3?`Elfliq — ${flavor}`:p.name)}</h2>
  ${p.img?`<img class="hero" src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:`<div class="pic" style="border-radius:14px"><span class="placeholder">✦</span></div>`}
  <h2>${money(p.price)}</h2>
  <p class="muted">${esc(p.id===3?`Elfliq — ${flavor}`:p.descKey?t(p.descKey):p.desc||"")}</p>
  ${p.id===3?`<label for="flavorSelect" class="muted">${t("flavor")}</label>
  <select id="flavorSelect" class="flavor-select" onchange="selectFlavor(this.value)">
   ${elfliqFlavors.map(f=>`<option value="${esc(f)}" ${f===flavor?"selected":""}>${esc(f)}</option>`).join("")}
  </select>`:""}
  ${tierDescription(p)}
  <p class="muted">${t("category")}: ${esc(I18N[lang].categories[["Все","Устройство","Картриджи","Жидкость","Одноразки"].indexOf(p.cat)]||p.cat)}<br>${t("available")}: ${p.stock}</p>
  <div class="variant">
   <div style="flex:1">${t("quantity")}</div>
   <div class="qty">
    <button onclick="change(${p.id},-1)">−</button>
    <span id="productQty">${qty}</span>
    <button onclick="change(${p.id},1)" ${p.stock<=0||qty>=p.stock?'disabled':''}>+</button>
   </div>
  </div>
  <button class="btn" style="margin-top:18px" onclick="closeProduct();openCart()">${t("toCart")}</button>
 `;
 document.getElementById("productModal").classList.add("show");
}

function selectFlavor(flavor){
 selectedFlavor[3]=flavor;
 openProduct(3);
}
function closeProduct(){document.getElementById("productModal").classList.remove("show")}

function change(pid,d){
 const p=products.find(x=>x.id===pid);
 if(!p)return;
 const flavor=pid===3?(selectedFlavor[3]||elfliqFlavors[0]):"";
 let item=getCartItem(pid,flavor);

 if(d>0&&p.stock<=0){alert(t("noStock"));return}
 if(!item&&d>0){
  item={pid,flavor:flavorKey(pid,flavor),qty:0};
  cart.push(item);
 }
 if(item){
  if(d>0&&item.qty>=p.stock){alert(t("maxStock"));return}
  item.qty=Math.max(0,item.qty+d);
  if(item.qty===0)cart=cart.filter(x=>x!==item);
 }
 updateCartBar();
 if(document.getElementById("productModal").classList.contains("show"))openProduct(pid);
}

function updateCartBar(){
 const n=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("cartCount").textContent=n;
 document.getElementById("cartbar").classList.toggle("show",n>0);
}

function openCart(){
 const box=document.getElementById("cartItems");
 const checkoutBtn=document.getElementById("checkoutBtn");
 if(!cart.length){
  box.innerHTML=`<p class="muted">${t("emptyCart")}</p>`;
  document.getElementById("cartTotal").textContent="";
 }else{
  let total=0;
  box.innerHTML=cart.map(x=>{
   const p=products.find(a=>a.id===x.pid);
   if(!p)return "";
   const price=unitPrice(p,x.qty);
   const sum=lineTotal(p,x.qty);
   total+=sum;
   const label=p.id===3?`Elfliq — ${x.flavor}`:p.name;
   return `
    <div class="variant">
     <div style="flex:1;min-width:0">
      <div>${esc(label)}</div>
      <div class="muted" style="font-size:12px">${x.qty} × ${money(price)}</div>
      <div style="font-weight:800;margin-top:4px">${money(sum)}</div>
     </div>
     <div class="qty">
      <button onclick="cartChange(${x.pid},-1,'${esc(x.flavor)}')">−</button>
      <span>${x.qty}</span>
      <button onclick="cartChange(${x.pid},1,'${esc(x.flavor)}')" ${x.qty>=p.stock?'disabled':''}>+</button>
     </div>
    </div>
   `;
  }).join("");
  document.getElementById("cartTotal").textContent=t("total")+": "+money(total);
 }
 checkoutBtn.style.display="block";
 checkoutBtn.textContent=t("checkout");
 document.getElementById("cartModal").classList.add("show");
}

function cartChange(pid,d,flavor){
 const p=products.find(x=>x.id===pid);
 if(!p)return;
 let item=cart.find(x=>x.pid===pid&&x.flavor===(pid===3?flavor:""));
 if(!item)return;
 if(d>0&&item.qty>=p.stock){alert(t("maxStock"));return}
 item.qty+=d;
 if(item.qty<=0)cart=cart.filter(x=>x!==item);
 updateCartBar();
 openCart();
}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}

function checkout(){
 if(!cart.length){alert(t("emptyAlert"));return}
 document.getElementById("cartItems").innerHTML=`
  <h3>${t("customerDetails")}</h3>
  <p class="muted">${t("checkDetails")}</p>
  <input id="customerName" class="field" placeholder="${t("namePlaceholder")}" autocomplete="name" maxlength="100">
  <input id="customerContact" class="field" placeholder="${t("contactPlaceholder")}" autocomplete="tel" maxlength="100">
  <label for="customerComment" class="muted">${t("meeting")}</label>
  <input id="customerComment" class="field" value="${MEETING_ADDRESS}" readonly aria-readonly="true">
  <button class="btn" onclick="sendOrder()">${t("send")}</button>
  <button class="btn" style="margin-top:10px;background:#252a35" onclick="openCart()">${t("back")}</button>
 `;
 document.getElementById("cartTotal").textContent="";
 document.getElementById("checkoutBtn").style.display="none";
}

function sendOrder(){
 const name=document.getElementById("customerName").value.trim();
 const contactValue=document.getElementById("customerContact").value.trim();
 if(!name||!contactValue){alert(t("fill"));return}
 if(!cart.length){alert(t("emptyAlert"));return}

 let total=0;
 const itemsText=cart.map(x=>{
  const p=products.find(a=>a.id===x.pid);
  if(!p)return "";
  const price=unitPrice(p,x.qty);
  const sum=lineTotal(p,x.qty);
  total+=sum;
  const label=p.id===3?`Elfliq — ${x.flavor}`:p.name;
  return `• ${label} — ${x.qty} шт. × ${money(price)} = ${money(sum)}`;
 }).filter(Boolean).join("\n");

 const orderText=`${t("order")}
${t("customer")}: ${name}
${t("phone")}: ${contactValue}
${t("items")}:
${itemsText}
${t("total")}: ${money(total)}
${t("meetingLine")}: ${MEETING_ADDRESS}
${t("confirm")}`;

 const url=CONTACT_URL+"?text="+encodeURIComponent(orderText);
 closeCart();
 closeProduct();
 if(tg&&tg.initData)tg.openTelegramLink(url);
 else window.open(url,"_blank","noopener");
 alert(t("telegramAlert"));
}

try{
 const saved=localStorage.getItem("vlm_lang");
 if(saved&&I18N[saved])lang=saved;
}catch(e){}
setLanguage(lang);
</script>
</body>
</html>
