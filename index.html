<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>VLM SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#111111; --card:#1d1d1d; --line:#444; --text:#f4f4f4;
      --muted:#9b9b9b; --accent:#16b77b; --white:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    .app{max-width:900px;margin:auto;padding:14px 14px 90px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .logo{font-size:24px;font-weight:800;flex:1}
    .icon{width:44px;height:44px;border:1px solid #555;border-radius:50%;background:transparent;color:#fff;font-size:22px}
    .search{width:100%;padding:15px 16px;border:1px solid #555;border-radius:16px;background:#1b1b1b;color:#fff;outline:none}
    .chips{display:flex;gap:9px;overflow:auto;padding:12px 0;scrollbar-width:none}
    .chip{white-space:nowrap;padding:11px 17px;border:1px solid #555;border-radius:24px;background:#1b1b1b;color:#fff}
    .chip.active{background:#fff;color:#111}
    .sorts{display:flex;gap:9px;margin-bottom:16px}
    .sort{padding:10px 15px;border:1px solid #555;border-radius:20px;background:#1b1b1b;color:#fff}
    .sort.active{background:#fff;color:#111}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .product{background:var(--card);border:1px solid #555;border-radius:22px;overflow:hidden;cursor:pointer}
    .pic{aspect-ratio:1/1;background:#090909;display:flex;align-items:center;justify-content:center;color:#777}
    .pic img{width:100%;height:100%;object-fit:cover}
    .pbody{padding:12px}
    .name{font-size:17px;font-weight:700;margin-bottom:6px}
    .stock{color:var(--accent);font-weight:600;font-size:14px}
    .price{margin-top:8px;font-weight:700}
    .empty{text-align:center;color:var(--muted);padding:40px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:20}
    .overlay.show{display:block}
    .sheet{position:absolute;right:0;top:0;height:100%;width:min(88%,430px);background:#151515;padding:22px;overflow:auto}
    .sheet h2{margin-top:0}
    .close{position:absolute;right:18px;top:14px;background:none;border:0;color:#fff;font-size:30px}
    .menuitem{display:block;width:100%;padding:18px 0;border:0;border-bottom:1px solid #444;background:none;color:#fff;text-align:left;font-size:18px}
    .cta{width:100%;padding:15px;border:0;border-radius:15px;background:#fff;color:#111;font-weight:700;margin-top:18px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;z-index:30;align-items:flex-end}
    .modal.show{display:flex}
    .modalbox{width:100%;max-height:92%;overflow:auto;background:#151515;border-radius:24px 24px 0 0;padding:20px}
    .hero{width:100%;border-radius:18px;aspect-ratio:1/1;object-fit:cover;background:#090909}
    .variant{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #444}
    .variant .vname{flex:1}
    .qty button{width:38px;height:38px;border:1px solid #555;background:#1d1d1d;color:#fff;border-radius:10px}
    .cartbar{position:fixed;left:12px;right:12px;bottom:12px;display:none;background:#fff;color:#111;border-radius:16px;padding:14px 16px;font-weight:800;z-index:10}
    .cartbar.show{display:flex;justify-content:space-between}
    .field{width:100%;padding:14px;border:1px solid #555;border-radius:12px;background:#1b1b1b;color:#fff;margin:8px 0;outline:none}
    .muted{color:var(--muted)}
    @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">VLM SHOP</div>
    <button class="icon" onclick="openCart()">🛒</button>
    <button class="icon" onclick="openMenu()">☰</button>
  </div>

  <input id="search" class="search" placeholder="Поиск товаров" oninput="render()">
  <div id="cats" class="chips"></div>
  <div class="sorts">
    <button class="sort active" id="sortStock" onclick="setSort('stock')">По наличию ↓</button>
    <button class="sort" id="sortName" onclick="setSort('name')">По названию</button>
  </div>
  <div id="grid" class="grid"></div>
</div>

<div id="cartbar" class="cartbar" onclick="openCart()">
  <span>🛒 Корзина</span><span id="cartCount">0</span>
</div>

<div id="menuOverlay" class="overlay" onclick="if(event.target===this)closeMenu()">
  <div class="sheet">
    <button class="close" onclick="closeMenu()">×</button>
    <h2>Меню</h2>
    <p class="muted">Полезные ссылки</p>
    <button class="menuitem" onclick="info('О магазине','VLM SHOP — каталог разрешённых товаров без никотина.')">О магазине</button>
    <button class="menuitem" onclick="info('Доставка','Укажите здесь свои условия доставки.')">Доставка</button>
    <button class="menuitem" onclick="info('Оплата','Укажите здесь способы оплаты.')">Оплата</button>
    <button class="menuitem" onclick="info('Возврат','Укажите здесь правила возврата.')">Возврат</button>
    <button class="menuitem" onclick="info('Частые вопросы','Добавьте сюда ответы на частые вопросы.')">Частые вопросы</button>
    <button class="cta" onclick="contact()">💬 Связаться</button>
  </div>
</div>

<div id="productModal" class="modal" onclick="if(event.target===this)closeProduct()">
  <div class="modalbox" id="productBox"></div>
</div>

<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()">
  <div class="modalbox">
    <button class="close" onclick="closeCart()">×</button>
    <h2>Корзина</h2>
    <div id="cartItems"></div>
    <div id="cartTotal" style="margin-top:14px;font-weight:800"></div>
    <button class="cta" onclick="checkout()">Оформить заказ</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const products = [
  {id:1,name:"Товар 1",cat:"Новинки",price:10,stock:8,img:"",desc:"Описание товара.",variants:["Вариант 1","Вариант 2"]},
  {id:2,name:"Товар 2",cat:"Хиты",price:15,stock:4,img:"",desc:"Описание товара.",variants:["Вариант 1"]},
  {id:3,name:"Товар 3",cat:"Аксессуары",price:20,stock:0,img:"",desc:"Описание товара.",variants:["Вариант 1","Вариант 2"]},
  {id:4,name:"Товар 4",cat:"Новинки",price:12,stock:11,img:"",desc:"Описание товара.",variants:["Вариант 1"]},
  {id:5,name:"Товар 5",cat:"Хиты",price:18,stock:6,img:"",desc:"Описание товара.",variants:["Вариант 1","Вариант 2"]},
  {id:6,name:"Товар 6",cat:"Аксессуары",price:25,stock:3,img:"",desc:"Описание товара.",variants:["Вариант 1"]}
];

let category="Все", sort="stock", cart=[];

function categories(){
  const cs=["Все",...new Set(products.map(p=>p.cat))];
  document.getElementById("cats").innerHTML=cs.map(c=>`<button class="chip ${c===category?'active':''}" onclick="category='${c}';render()">${c}</button>`).join("");
}
function render(){
  categories();
  let q=document.getElementById("search").value.toLowerCase();
  let arr=products.filter(p=>(category==="Все"||p.cat===category)&&p.name.toLowerCase().includes(q));
  if(sort==="stock") arr.sort((a,b)=>b.stock-a.stock);
  else arr.sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById("grid").innerHTML=arr.length?arr.map(p=>`
    <div class="product" onclick="openProduct(${p.id})">
      <div class="pic">${p.img?`<img src="${p.img}" alt="">`:"Фото товара"}</div>
      <div class="pbody"><div class="name">${p.name}</div><div class="stock">${p.stock>0?"В наличии":"Нет в наличии"}</div><div class="price">${p.price} zł</div></div>
    </div>`).join(""):`<div class="empty">Ничего не найдено</div>`;
  updateCartBar();
}
function setSort(s){sort=s;document.getElementById("sortStock").classList.toggle("active",s==="stock");document.getElementById("sortName").classList.toggle("active",s==="name");render()}
function openMenu(){document.getElementById("menuOverlay").classList.add("show")}
function closeMenu(){document.getElementById("menuOverlay").classList.remove("show")}
function info(title,text){closeMenu();alert(title+"\\n\\n"+text)}
function contact(){closeMenu(); alert("Здесь можно указать @username менеджера.")}
function openProduct(id){
  const p=products.find(x=>x.id===id);
  document.getElementById("productBox").innerHTML=`
    <button class="close" onclick="closeProduct()">×</button>
    <h2>${p.name}</h2>
    <div class="pic" style="border-radius:18px;margin-bottom:14px">${p.img?`<img class="hero" src="${p.img}" alt="">`:"Фото товара"}</div>
    <h3>Описание</h3><p class="muted">${p.desc}</p>
    <h3>Параметры</h3><p class="muted">Категория: ${p.cat}<br>Количество на складе: ${p.stock}</p>
    <h3>Варианты</h3>
    ${p.variants.map((v,i)=>`<div class="variant"><div class="vname">${v}</div><div class="qty"><button onclick="change(${p.id},${i},-1)">−</button><button id="q-${p.id}-${i}" disabled>0</button><button onclick="change(${p.id},${i},1)">+</button></div></div>`).join("")}
    <button class="cta" onclick="closeProduct();openCart()">🛒 Перейти в корзину</button>`;
  document.getElementById("productModal").classList.add("show");
}
function closeProduct(){document.getElementById("productModal").classList.remove("show")}
function change(pid,vi,d){
  const p=products.find(x=>x.id===pid), key=pid+"-"+vi;
  let item=cart.find(x=>x.key===key);
  if(!item && d>0){item={key,pid,vi,qty:0};cart.push(item)}
  if(item){item.qty=Math.max(0,item.qty+d); if(item.qty===0)cart=cart.filter(x=>x!==item)}
  const q=document.getElementById("q-"+key); if(q)q.innerText=item?.qty||0;
  updateCartBar();
}
function updateCartBar(){
  let n=cart.reduce((s,x)=>s+x.qty,0); document.getElementById("cartCount").innerText=n;
  document.getElementById("cartbar").classList.toggle("show",n>0);
}
function openCart(){
  const box=document.getElementById("cartItems");
  if(!cart.length){box.innerHTML='<p class="muted">Корзина пуста.</p>';document.getElementById("cartTotal").innerText="";return document.getElementById("cartModal").classList.add("show")}
  let total=0;
  box.innerHTML=cart.map(x=>{let p=products.find(a=>a.id===x.pid),v=p.variants[x.vi];total+=p.price*x.qty;return `<div class="variant"><div class="vname">${p.name}<br><span class="muted">${v}</span></div><div>${x.qty} × ${p.price} zł</div></div>`}).join("");
  document.getElementById("cartTotal").innerText="Итого: "+total+" zł";
  document.getElementById("cartModal").classList.add("show");
}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}
function checkout(){
  if(!cart.length)return;
  document.getElementById("cartItems").innerHTML=`
    <h3>Оформление заказа</h3>
    <input id="name" class="field" placeholder="Ваше имя">
    <input id="phone" class="field" placeholder="Телефон или @username">
    <input id="comment" class="field" placeholder="Комментарий / адрес доставки">
    <button class="cta" onclick="sendOrder()">Отправить заказ</button>`;
  document.getElementById("cartTotal").innerText="";
}
function sendOrder(){
  const name=document.getElementById("name").value.trim(), phone=document.getElementById("phone").value.trim(), comment=document.getElementById("comment").value.trim();
  if(!name||!phone){alert("Заполните имя и контакт.");return}
  const order={name,phone,comment,items:cart.map(x=>{let p=products.find(a=>a.id===x.pid);return {product:p.name,variant:p.variants[x.vi],qty:x.qty,price:p.price}})};
  if(tg?.sendData){tg.sendData(JSON.stringify(order)); alert("Заказ отправлен!"); cart=[]; updateCartBar(); closeCart();}
  else alert("Откройте магазин внутри Telegram для отправки заказа.");
}
render();
</script>
</body>
</html>
